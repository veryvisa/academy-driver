<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1680" width="900" height="1680" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">在 BC 从零开始考驾照，从 L 到 Class 5 一共要过几关、大概要多久？</title>
<desc id="d">两场考试加一次驾驶记录评估：笔试拿 L，第一次路考拿 N，N 阶段期满做驾驶记录评估升 Class 5。按最短持有期，25 岁以下至少 30 或 36 个月，25 岁及以上至少 21 个月，不含约考等待。</desc>
<rect width="900" height="1680" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="162" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">分级驾照三级台阶 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">在 BC 从零开始考驾照，从 L 到 Class 5 一共要过几</text>
<text x="40" y="132" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">关、大概要多久？</text>
<rect x="40" y="186" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="217" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="253" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">两场考试加一次驾驶记录评估：笔试拿 L，第一次路考拿 N，N 阶段期满做驾驶记</text>
<text x="64" y="286" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">录评估升 Class 5。按最短持有期，25 岁以下至少 30 或 36 个月，25 岁及</text>
<text x="64" y="319" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">以上至少 21 个月，不含约考等待。</text>
<text x="40" y="395" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">最短持有期（月）</text>
<rect x="40.0" y="415" width="403.0" height="229" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="447" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">25 岁以下</text>
<text x="54.0" y="475" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">L 阶段</text>
<text x="54.0" y="497" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">12 个月</text>
<text x="54.0" y="531" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">N 阶段</text>
<text x="54.0" y="553" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">24 个月；L 阶段读完认可课程 18 个月</text>
<text x="54.0" y="587" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">合计下限</text>
<text x="54.0" y="609" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">36 个月，读完课程 30 个月</text>
<rect x="457.0" y="415" width="403.0" height="229" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="471.0" y="447" font-size="19" fill="#0E7C7B" font-weight="700" text-anchor="start">25 岁及以上</text>
<text x="471.0" y="475" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">L 阶段</text>
<text x="471.0" y="497" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">9 个月</text>
<text x="471.0" y="531" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">N 阶段</text>
<text x="471.0" y="553" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">12 个月</text>
<text x="471.0" y="587" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">合计下限</text>
<text x="471.0" y="609" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">21 个月</text>
<text x="40" y="688" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">三级台阶</text>
<rect x="40" y="706" width="820" height="129" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="740" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">第一关：知识测试 → L（Class 7L）</text>
<circle cx="64" cy="769" r="3.2" fill="#5B6B7F"/>
<text x="76" y="774" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">满 16 周岁；未满 18 岁要父母或监护人同意书</text>
<circle cx="64" cy="800" r="3.2" fill="#5B6B7F"/>
<text x="76" y="805" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">50 题答对 40 题及格，另做视力筛查；可在线考</text>
<line x1="450" y1="837" x2="450" y2="864" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,861 L458,861 L450,873 Z" fill="#5B6B7F"/>
<text x="466" y="856" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">L 阶段期满、期间无禁驾</text>
<rect x="40" y="875" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="909" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第二关：第一次路考（Class 7）→ N</text>
<circle cx="64" cy="938" r="3.2" fill="#2F5D8A"/>
<text x="76" y="943" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">L 阶段要有合格监督人坐副驾，午夜至凌晨 5 点不得驾驶</text>
<circle cx="64" cy="969" r="3.2" fill="#2F5D8A"/>
<text x="76" y="974" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">通过后可独自驾驶</text>
<line x1="450" y1="1006" x2="450" y2="1033" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1030 L458,1030 L450,1042 Z" fill="#5B6B7F"/>
<text x="466" y="1025" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">N 阶段期满、记录干净</text>
<rect x="40" y="1044" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1078" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">第三关：驾驶记录评估 → 带限制 55 的 Class 5</text>
<circle cx="64" cy="1107" r="3.2" fill="#B45309"/>
<text x="76" y="1112" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不再考第二次路考（2026-10-19 起）</text>
<circle cx="64" cy="1138" r="3.2" fill="#B45309"/>
<text x="76" y="1143" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">期间无禁驾或吊销、无严重超速与电子设备类定罪</text>
<line x1="450" y1="1175" x2="450" y2="1202" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1199 L458,1199 L450,1211 Z" fill="#5B6B7F"/>
<text x="466" y="1194" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">12 个月安全驾驶</text>
<rect x="40" y="1213" width="820" height="98" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1247" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">不带限制的 Class 5</text>
<circle cx="64" cy="1276" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1281" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">限制 55 到期自动解除</text>
<rect x="40" y="1332" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1366" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1395" r="3.2" fill="#B45309"/>
<text x="76" y="1400" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「考过一次路考就是正式驾照」：第一次路考只拿到 N。</text>
<circle cx="64" cy="1427" r="3.2" fill="#B45309"/>
<text x="76" y="1432" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「第二次路考取消了，台阶也没了」：N 阶段和持有期还在，只是升级改看记录。</text>
<circle cx="64" cy="1458" r="3.2" fill="#B45309"/>
<text x="76" y="1463" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「一张罚单只是罚款」：禁驾会让进度从头算，一次可能退回起点。</text>
<line x1="40" y1="1519" x2="860" y2="1519" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1544" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1566" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Changes to the Graduated Licensing Program；Get your L；Get your N</text>
<text x="40" y="1588" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · You have a Class 7L licence（2026-11-03 回读）</text>
<text x="40" y="1616" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">月数是规则允许的最短时间，不含约考排队；持海外驾照迁入的人可能不走 GLP，另看换照规则。个人进度以 ICBC 驾驶记录为</text>
<text x="40" y="1636" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">准。</text>
</svg>
