<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1349" width="900" height="1349" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">升到 Class 5 以后驾照上的「限制 55」管什么，被禁驾了会怎样？</title>
<desc id="d">2026 年 10 月 19 日起，经驾驶记录评估或自动升级拿到的 Class 5 都带限制 55：开车时零血液酒精、零血液药物，12 个月后自动解除；到期前被禁驾或吊销，从恢复驾照之日重新计 12 个月。</desc>
<rect width="900" height="1349" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="162" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">限制 55 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">升到 Class 5 以后驾照上的「限制 55」管什么，被禁驾了</text>
<text x="40" y="132" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">会怎样？</text>
<rect x="40" y="186" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="217" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="253" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">2026 年 10 月 19 日起，经驾驶记录评估或自动升级拿到的 Class 5 都带限</text>
<text x="64" y="286" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">制 55：开车时零血液酒精、零血液药物，12 个月后自动解除；到期前被禁驾或吊</text>
<text x="64" y="319" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">销，从恢复驾照之日重新计 12 个月。</text>
<rect x="40" y="377" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="411" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">谁会有</text>
<circle cx="64" cy="440" r="3.2" fill="#2F5D8A"/>
<text x="76" y="445" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">经驾驶记录评估升到「带限制的 Class 5」</text>
<circle cx="64" cy="472" r="3.2" fill="#2F5D8A"/>
<text x="76" y="476" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">收到 ICBC 确认信、10 月 19 日一次性自动升级</text>
<rect x="40" y="528" width="820" height="129" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="562" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">管什么</text>
<circle cx="64" cy="591" r="3.2" fill="#B42318"/>
<text x="76" y="596" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开车时血液酒精必须为零</text>
<circle cx="64" cy="622" r="3.2" fill="#B42318"/>
<text x="76" y="628" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开车时血液药物必须为零</text>
<rect x="40" y="679" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="713" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">何时解除</text>
<circle cx="64" cy="742" r="3.2" fill="#1A7F4B"/>
<text x="76" y="747" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">12 个月后自动解除，不用另办手续、不用换卡</text>
<circle cx="64" cy="774" r="3.2" fill="#1A7F4B"/>
<text x="76" y="778" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">到期日印在驾照背面</text>
<line x1="450" y1="810" x2="450" y2="837" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,834 L458,834 L450,846 Z" fill="#5B6B7F"/>
<text x="466" y="829" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">到期前出事</text>
<rect x="40" y="848" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="882" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">何时重算</text>
<circle cx="64" cy="911" r="3.2" fill="#B45309"/>
<text x="76" y="916" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">到期前被禁驾或吊销</text>
<circle cx="64" cy="942" r="3.2" fill="#B45309"/>
<text x="76" y="948" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">12 个月从恢复驾照之日重新计算</text>
<rect x="40" y="999" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1033" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1062" r="3.2" fill="#B45309"/>
<text x="76" y="1067" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「升到 Class 5 就没有新手限制了」：限制 55 期内照样一滴酒、一点药物都不能有</text>
<circle cx="64" cy="1094" r="3.2" fill="#B45309"/>
<text x="76" y="1098" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「被禁驾后接着开完剩下的月份」：从恢复驾照之日起重新计满 12 个月</text>
<circle cx="64" cy="1125" r="3.2" fill="#B45309"/>
<text x="76" y="1130" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「带限制 55 也能给 N 牌当监督人」：监督人的 Class 5 必须不带这项限制</text>
<line x1="40" y1="1186" x2="860" y2="1186" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1210" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1232" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC：You have a Class 7 licence and you're under 25</text>
<text x="40" y="1255" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC：You may be eligible for an automatic upgrade</text>
<text x="40" y="1277" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC：You hold a Class 7 licence and you're 25 or older</text>
<text x="40" y="1305" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-06 回读 ICBC 三页；个案以驾照背面与 ICBC 驾照办事处答复为准。</text>
</svg>
