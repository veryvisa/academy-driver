<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1279" width="900" height="1279" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">中国驾照换 BC 驾照：要考什么？能不能不走 L 和 N？</title>
<desc id="d">不能免试：中国大陆不在 ICBC 互换名单上，要考知识测试和 Class 5 路考。但能证明非学习期驾照至少两年，就可免进分级驾照计划（GLP）。</desc>
<rect width="900" height="1279" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">中国驾照换 BC 驾照 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">中国驾照换 BC 驾照：要考什么？能不能不走 L 和 N？</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不能免试：中国大陆不在 ICBC 互换名单上，要考知识测试和 Class 5 路考。</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">但能证明非学习期驾照至少两年，就可免进分级驾照计划（GLP）。</text>
<rect x="40" y="304" width="820" height="160" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="338" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">换照要考什么</text>
<circle cx="64" cy="367" r="3.2" fill="#B42318"/>
<text x="76" y="372" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">中国大陆不在 ICBC 的驾照互换名单上</text>
<circle cx="64" cy="398" r="3.2" fill="#B42318"/>
<text x="76" y="404" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">名单外要先考知识测试，再考 Class 5 路考</text>
<circle cx="64" cy="430" r="3.2" fill="#B42318"/>
<text x="76" y="435" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">名单会变，以 ICBC 现行页为准</text>
<line x1="450" y1="466" x2="450" y2="494" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,490 L458,490 L450,502 Z" fill="#5B6B7F"/>
<text x="466" y="486" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再看驾龄</text>
<rect x="40" y="504" width="820" height="160" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="538" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">能不能不走 L 和 N</text>
<circle cx="64" cy="568" r="3.2" fill="#1A7F4B"/>
<text x="76" y="572" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">能用原件证明持有非学习期驾照至少两年，可免进 GLP</text>
<circle cx="64" cy="599" r="3.2" fill="#1A7F4B"/>
<text x="76" y="604" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">免走 GLP 后，考过知识测试直接考 Class 5 路考</text>
<circle cx="64" cy="630" r="3.2" fill="#1A7F4B"/>
<text x="76" y="636" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">证明不了两年的，才拿带分级限制的 Class 7 或 Class 8</text>
<line x1="450" y1="667" x2="450" y2="694" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,691 L458,691 L450,703 Z" fill="#5B6B7F"/>
<text x="466" y="686" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">证明怎么交</text>
<rect x="40" y="705" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="739" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">驾龄证明的要求</text>
<circle cx="64" cy="768" r="3.2" fill="#B45309"/>
<text x="76" y="773" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">中国不在可事后电邮补件的名单上</text>
<circle cx="64" cy="800" r="3.2" fill="#B45309"/>
<text x="76" y="804" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">要本人带原件到驾照办事处</text>
<circle cx="64" cy="831" r="3.2" fill="#B45309"/>
<text x="76" y="836" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">非英文要由 ICBC 认可的译者翻译</text>
<rect x="40" y="888" width="820" height="180" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="922" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="950" r="3.2" fill="#B45309"/>
<text x="76" y="956" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「中国驾照可以直接免试换 BC 驾照。」：不能，中国大陆不在互换名单上，要先考知识测试，再考 </text>
<text x="76" y="981" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Class 5 路考。</text>
<circle cx="64" cy="1008" r="3.2" fill="#B45309"/>
<text x="76" y="1012" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「国内开了十年，也得从 L 牌重新走分级。」：不一定，能用原件证明至少两年非学习期驾龄，就可</text>
<text x="76" y="1038" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">免进 GLP。</text>
<line x1="40" y1="1094" x2="860" y2="1094" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1118" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1140" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Get your L</text>
<text x="40" y="1163" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Fees</text>
<text x="40" y="1185" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Moving from outside Canada</text>
<text x="40" y="1207" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Proving your driving experience</text>
<text x="40" y="1236" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-09 依据讲解页与已核规则摘要制作；个案以官方原文与主管机构答复为准。</text>
</svg>
