<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1408" width="900" height="1408" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">新居民外国驾照在 BC 能开多久？毕业转工签呢？</title>
<desc id="d">成为 BC 居民后，须在 90 天内把有效驾照换成 BC 驾照；只有 ICBC 列明的情形可继续用原驾照。一般工签不在豁免清单里。</desc>
<rect width="900" height="1408" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">新居民外国驾照能用多久 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">新居民外国驾照在 BC 能开多久？毕业转工签呢？</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">成为 BC 居民后，须在 90 天内把有效驾照换成 BC 驾照；只有 ICBC 列明的</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">情形可继续用原驾照。一般工签不在豁免清单里。</text>
<rect x="40" y="304" width="820" height="129" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="338" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">默认规则</text>
<circle cx="64" cy="367" r="3.2" fill="#B42318"/>
<text x="76" y="372" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">成为 BC 居民后，须在 90 天内换成 BC 驾照</text>
<circle cx="64" cy="398" r="3.2" fill="#B42318"/>
<text x="76" y="404" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不能凭外国驾照一直开下去</text>
<line x1="450" y1="435" x2="450" y2="462" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,459 L458,459 L450,471 Z" fill="#5B6B7F"/>
<text x="466" y="454" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再看有没有豁免</text>
<rect x="40" y="473" width="820" height="192" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="507" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">ICBC 列明可继续用原驾照</text>
<circle cx="64" cy="536" r="3.2" fill="#1A7F4B"/>
<text x="76" y="541" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">游客：最长六个月</text>
<circle cx="64" cy="568" r="3.2" fill="#1A7F4B"/>
<text x="76" y="572" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">在 BC 指定院校全日制就读、持有效学生豁免者</text>
<circle cx="64" cy="599" r="3.2" fill="#1A7F4B"/>
<text x="76" y="604" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">通常居住地在省外者</text>
<circle cx="64" cy="630" r="3.2" fill="#1A7F4B"/>
<text x="76" y="636" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">季节性农业工人项目（SAWP）：最长 12 个月</text>
<line x1="450" y1="667" x2="450" y2="694" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,691 L458,691 L450,703 Z" fill="#5B6B7F"/>
<text x="466" y="686" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再看毕业转工签</text>
<rect x="40" y="705" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="739" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">留学生毕业转工签后</text>
<circle cx="64" cy="768" r="3.2" fill="#B45309"/>
<text x="76" y="773" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">靠的是全日制就读的有效学生豁免，毕业后前提没了</text>
<circle cx="64" cy="800" r="3.2" fill="#B45309"/>
<text x="76" y="804" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">豁免清单里工签只列了 SAWP，一般工签不在其中</text>
<circle cx="64" cy="831" r="3.2" fill="#B45309"/>
<text x="76" y="836" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">所以一般要按新居民的 90 天规则换照</text>
<rect x="40" y="888" width="820" height="129" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="922" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">国际驾照（IDP）</text>
<circle cx="64" cy="950" r="3.2" fill="#5B6B7F"/>
<text x="76" y="956" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">ICBC 页上的 IDP 是加拿大持照人出国用、由 BCAA 签发的原驾照译本</text>
<circle cx="64" cy="982" r="3.2" fill="#5B6B7F"/>
<text x="76" y="987" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">官方页没有说持 IDP 可以延长在 BC 的使用期</text>
<rect x="40" y="1038" width="820" height="180" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1072" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1102" r="3.2" fill="#B45309"/>
<text x="76" y="1106" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「外国驾照加国际驾照（IDP）就可以一直在 BC 开车」：不能。官方页没有说持 IDP 可延长使用</text>
<text x="76" y="1132" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">期，成为居民后仍须 90 天内换照。</text>
<circle cx="64" cy="1158" r="3.2" fill="#B45309"/>
<text x="76" y="1164" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「留学生毕业转工签后，原来的驾照照样能用」：通常不能。学生豁免的前提是全日制就读，毕业后一</text>
<text x="76" y="1189" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">般按 90 天规则换照。</text>
<line x1="40" y1="1244" x2="860" y2="1244" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1270" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1292" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Fees</text>
<text x="40" y="1314" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Moving from outside Canada</text>
<text x="40" y="1336" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">International driving permits</text>
<text x="40" y="1364" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-09 依据讲解页与已核规则摘要制作；个案以官方原文与主管机构答复为准。</text>
</svg>
