<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1504" width="900" height="1504" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">第一次路考为什么容易挂？考官最常记下哪些错</title>
<desc id="d">开得稳不够：考官按观察、空间距离、速度控制、转向与沟通评分，ICBC 点名的常见挂点集中在超速、停车、肩查和扫视路口。</desc>
<rect width="900" height="1504" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">路考常见挂点 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">第一次路考为什么容易挂？考官最常记下哪些错</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">开得稳不够：考官按观察、空间距离、速度控制、转向与沟通评分，ICBC 点名的</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">常见挂点集中在超速、停车、肩查和扫视路口。</text>
<rect x="40" y="304" width="820" height="160" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="338" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">考官评什么</text>
<circle cx="64" cy="367" r="3.2" fill="#2F5D8A"/>
<text x="76" y="372" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">按观察、空间距离、速度控制、转向与沟通评分</text>
<circle cx="64" cy="398" r="3.2" fill="#2F5D8A"/>
<text x="76" y="404" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">你要在路线中完成一系列动作</text>
<circle cx="64" cy="430" r="3.2" fill="#2F5D8A"/>
<text x="76" y="435" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">还要口头指出看到的危险</text>
<rect x="40" y="486" width="820" height="160" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="520" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">速度与停车</text>
<circle cx="64" cy="550" r="3.2" fill="#B42318"/>
<text x="76" y="554" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">学校区与游乐场区超速（官方说是常见挂科原因）</text>
<circle cx="64" cy="581" r="3.2" fill="#B42318"/>
<text x="76" y="586" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">跟着超速车流走</text>
<circle cx="64" cy="612" r="3.2" fill="#B42318"/>
<text x="76" y="618" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">停车标志前没在正确位置完全停住</text>
<rect x="40" y="669" width="820" height="192" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="703" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">观察动作漏做</text>
<circle cx="64" cy="732" r="3.2" fill="#B45309"/>
<text x="76" y="737" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">右转不做右肩查</text>
<circle cx="64" cy="764" r="3.2" fill="#B45309"/>
<text x="76" y="768" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">变道或转向漏做后视镜、打灯、肩查</text>
<circle cx="64" cy="795" r="3.2" fill="#B45309"/>
<text x="76" y="800" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">绿灯也不扫视路口</text>
<circle cx="64" cy="826" r="3.2" fill="#B45309"/>
<text x="76" y="832" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">倒车要做 360 度环视</text>
<rect x="40" y="883" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="917" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">开得太慢也被评</text>
<circle cx="64" cy="946" r="3.2" fill="#B45309"/>
<text x="76" y="951" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">低风险路段开太慢会被评</text>
<circle cx="64" cy="978" r="3.2" fill="#B45309"/>
<text x="76" y="982" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">过度谨慎或过度激进同样会被评</text>
<rect x="40" y="1034" width="820" height="129" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="1068" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">评分标准的边界</text>
<circle cx="64" cy="1097" r="3.2" fill="#5B6B7F"/>
<text x="76" y="1102" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">须知单（MV2661）与《Tuning up for drivers》都没给分数线或扣分表</text>
<circle cx="64" cy="1128" r="3.2" fill="#5B6B7F"/>
<text x="76" y="1134" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">完成泊车动作时碰到路缘不算 FAIL</text>
<rect x="40" y="1185" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1219" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1248" r="3.2" fill="#B45309"/>
<text x="76" y="1253" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「开得稳、没出险情就能过路考」：不够，考官还看你有没有做出可见的观察与沟通动作。</text>
<circle cx="64" cy="1280" r="3.2" fill="#B45309"/>
<text x="76" y="1284" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「网上流传的路考扣分表就是官方评分标准」：不是，官方两份材料都没有给出分数线或扣分表。</text>
<line x1="40" y1="1340" x2="860" y2="1340" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1365" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1387" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Learn to Drive Smart: signs, markings and crossing safety</text>
<text x="40" y="1409" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Tuning up for drivers</text>
<text x="40" y="1432" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">What to expect during your road test</text>
<text x="40" y="1460" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-09 依据讲解页与已核规则摘要制作；个案以官方原文与主管机构答复为准。</text>
</svg>
