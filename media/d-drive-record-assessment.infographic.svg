<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1729" width="900" height="1729" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">2026 年 10 月 19 日以后，N 牌升 Class 5 还要不要考第二次路考？</title>
<desc id="d">不用考。2026-10-19 起第二次路考由驾驶记录评估取代：安全驾驶期满、期间记录干净，就本人到 ICBC 驾照办事处办升级，拿到带限制 55 的 Class 5。</desc>
<rect width="900" height="1729" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="162" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">驾驶记录评估 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">2026 年 10 月 19 日以后，N 牌升 Class 5 还要不要</text>
<text x="40" y="132" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">考第二次路考？</text>
<rect x="40" y="186" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="217" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="253" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不用考。2026-10-19 起第二次路考由驾驶记录评估取代：安全驾驶期满、期间记</text>
<text x="64" y="286" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">录干净，就本人到 ICBC 驾照办事处办升级，拿到带限制 55 的 Class 5。</text>
<text x="40" y="362" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">安全驾驶期按年龄分两档</text>
<rect x="40.0" y="382" width="403.0" height="196" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="414" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">25 岁以下</text>
<text x="54.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">没读认可课程</text>
<text x="54.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">N 阶段至少 24 个月安全驾驶</text>
<text x="54.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">L 阶段读完认可课程</text>
<text x="54.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">缩为 18 个月；报了名没读完仍按 24 个月</text>
<rect x="457.0" y="382" width="403.0" height="196" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="471.0" y="414" font-size="19" fill="#0E7C7B" font-weight="700" text-anchor="start">25 岁及以上</text>
<text x="471.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">持有期</text>
<text x="471.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">N 阶段至少 12 个月安全驾驶</text>
<text x="471.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">哪天能办</text>
<text x="471.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">驾驶记录上的 Earliest Exit Date 就是可以升</text>
<text x="471.0" y="543" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">级的日子</text>
<text x="40" y="622" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">从 N 到不带限制的 Class 5</text>
<rect x="40" y="640" width="820" height="160" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="674" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">第一步：期间记录干净</text>
<circle cx="64" cy="703" r="3.2" fill="#5B6B7F"/>
<text x="76" y="708" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">期间无禁驾或吊销</text>
<circle cx="64" cy="734" r="3.2" fill="#5B6B7F"/>
<text x="76" y="739" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">期间无严重超速（excessive speed）或使用电子设备类定罪</text>
<circle cx="64" cy="766" r="3.2" fill="#5B6B7F"/>
<text x="76" y="771" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">严重超速是一类单独的违规，不是任何一张超速罚单</text>
<line x1="450" y1="802" x2="450" y2="829" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,826 L458,826 L450,838 Z" fill="#5B6B7F"/>
<text x="466" y="821" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">满足后</text>
<rect x="40" y="840" width="820" height="160" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="874" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第二步：本人到 ICBC 驾照办事处</text>
<circle cx="64" cy="903" r="3.2" fill="#2F5D8A"/>
<text x="76" y="908" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">可预约也可直接前往；在线预约时服务类型选 Driving Record Assessment</text>
<circle cx="64" cy="935" r="3.2" fill="#2F5D8A"/>
<text x="76" y="940" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Service BC 网点与驾照代理点不办理</text>
<circle cx="64" cy="966" r="3.2" fill="#2F5D8A"/>
<text x="76" y="971" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">可一符合条件就换卡（$17），也可等驾照快到期时换发五年期新照（$75）</text>
<line x1="450" y1="1003" x2="450" y2="1030" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1027 L458,1027 L450,1039 Z" fill="#5B6B7F"/>
<text x="466" y="1022" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">评估通过</text>
<rect x="40" y="1041" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1075" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">第三步：带限制 55 的 Class 5</text>
<circle cx="64" cy="1104" r="3.2" fill="#B45309"/>
<text x="76" y="1109" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">12 个月内驾驶时零血液酒精、零血液药物</text>
<circle cx="64" cy="1135" r="3.2" fill="#B45309"/>
<text x="76" y="1140" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">期间被禁驾或吊销，12 个月从恢复驾照之日重新计算</text>
<circle cx="64" cy="1167" r="3.2" fill="#B45309"/>
<text x="76" y="1172" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">到期日印在驾照背面，到期自动解除，不用另办手续</text>
<line x1="450" y1="1203" x2="450" y2="1230" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1227 L458,1227 L450,1239 Z" fill="#5B6B7F"/>
<text x="466" y="1222" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">12 个月后</text>
<rect x="40" y="1241" width="820" height="98" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1275" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">不带限制的 Class 5</text>
<circle cx="64" cy="1304" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1309" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不用换卡</text>
<rect x="40" y="1361" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1395" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1424" r="3.2" fill="#B45309"/>
<text x="76" y="1429" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「吃过一张超速罚单就过不了评估」：门槛是严重超速这一类定罪，不是任何超速罚单。</text>
<circle cx="64" cy="1455" r="3.2" fill="#B45309"/>
<text x="76" y="1460" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「去驾校或 Service BC 网点就能办」：只在 ICBC 驾照办事处办理。</text>
<circle cx="64" cy="1487" r="3.2" fill="#B45309"/>
<text x="76" y="1492" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「升了 Class 5 就什么限制都没有」：先带 12 个月限制 55。</text>
<line x1="40" y1="1547" x2="860" y2="1547" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1572" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1594" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Changes to the Graduated Licensing Program（2026-11-03 回读）</text>
<text x="40" y="1616" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · You have a Class 7 licence and you're under 25 / You hold a Class 7 licence and you're 25 </text>
<text x="40" y="1637" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">or older</text>
<text x="40" y="1665" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC 现行规则；个人能否升级以 ICBC 驾驶记录与办事处答复为准。仍要考 Class 5 路考的是持部分外国驾照迁入、驾照过期超</text>
<text x="40" y="1685" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">过三年、被要求复考的人。</text>
</svg>
