<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">孩子拿 N 牌开车，能载几个同学，家里人算不算在乘客限制里？</title>
<desc id="d">25 岁以下的 N 驾驶者只能载一名乘客，直系亲属不计入；副驾坐着合格监督人时不受此限。25 岁及以上的 N 驾驶者不受乘客限制。</desc>
<rect width="900" height="1420" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="162" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">N 牌乘客限制 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">孩子拿 N 牌开车，能载几个同学，家里人算不算在乘客限制</text>
<text x="40" y="132" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">里？</text>
<rect x="40" y="186" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="217" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="253" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">25 岁以下的 N 驾驶者只能载一名乘客，直系亲属不计入；副驾坐着合格监督人时</text>
<text x="64" y="286" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不受此限。25 岁及以上的 N 驾驶者不受乘客限制。</text>
<text x="40" y="362" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">先看驾驶者年龄</text>
<rect x="40.0" y="382" width="403.0" height="229" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="54.0" y="414" font-size="19" fill="#B45309" font-weight="700" text-anchor="start">25 岁以下</text>
<text x="54.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">非家人乘客</text>
<text x="54.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">最多一名</text>
<text x="54.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">直系亲属</text>
<text x="54.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不计入这个上限</text>
<text x="54.0" y="554" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">N 牌</text>
<text x="54.0" y="576" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">车后要挂绿色 N 牌</text>
<rect x="457.0" y="382" width="403.0" height="229" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="471.0" y="414" font-size="19" fill="#1A7F4B" font-weight="700" text-anchor="start">25 岁及以上</text>
<text x="471.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">乘客</text>
<text x="471.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不受乘客限制</text>
<text x="471.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">N 牌</text>
<text x="471.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不用挂</text>
<text x="40" y="655" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">什么时候可以多载</text>
<rect x="40" y="673" width="820" height="160" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="707" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">副驾有合格监督人</text>
<circle cx="64" cy="736" r="3.2" fill="#2F5D8A"/>
<text x="76" y="741" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">年满 22 岁</text>
<circle cx="64" cy="767" r="3.2" fill="#2F5D8A"/>
<text x="76" y="772" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">持有效 Class 1–5 驾照，不带零酒精零药物限制（限制 55），能合法驾驶</text>
<circle cx="64" cy="799" r="3.2" fill="#2F5D8A"/>
<text x="76" y="804" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">坐在副驾驶位</text>
<line x1="450" y1="835" x2="450" y2="862" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,859 L458,859 L450,871 Z" fill="#5B6B7F"/>
<text x="466" y="854" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">没有监督人时</text>
<rect x="40" y="873" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="907" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">只按非家人数</text>
<circle cx="64" cy="936" r="3.2" fill="#B45309"/>
<text x="76" y="941" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">超过一名非家人乘客＝违反 N 牌限制</text>
<circle cx="64" cy="968" r="3.2" fill="#B45309"/>
<text x="76" y="973" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">一名同学加几位家人：ICBC 两个页面写法不一致，出门前问清 ICBC</text>
<rect x="40" y="1024" width="820" height="186" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1058" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1087" r="3.2" fill="#B45309"/>
<text x="76" y="1092" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「系好安全带就能随便载」：25 岁以下 N 驾驶者有乘客上限。</text>
<circle cx="64" cy="1119" r="3.2" fill="#B45309"/>
<text x="76" y="1124" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「家里人也算一个」：直系亲属不计入。</text>
<circle cx="64" cy="1150" r="3.2" fill="#B45309"/>
<text x="76" y="1155" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「违规载人出事保险就不赔」：单纯违反驾照限制条款不算违反保险条件（Insurance (Vehicle) </text>
<text x="76" y="1181" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Regulation s.55(3.1)），罚单另算。</text>
<line x1="40" y1="1236" x2="860" y2="1236" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1261" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1283" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Get your N（Limit one passenger，2026-11-03 回读）</text>
<text x="40" y="1305" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · You have a Class 7 licence and you're under 25 / you're 25 or older</text>
<text x="40" y="1328" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC Laws · Insurance (Vehicle) Regulation Part 5 s.55(3.1)（current to 2026-10-27）</text>
<text x="40" y="1356" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">直系亲属的范围以 ICBC 定义为准。《Get your N》写「不含直系亲属」，25 岁以下变更页写「除非全部乘客都是直系亲属」，</text>
<text x="40" y="1376" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">两者在「一名同学加家人」时结论不同。</text>
</svg>
