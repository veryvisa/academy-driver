<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">拿 L 或 N 牌开车，能不能用免提打电话、用手机导航，红灯停着能看手机吗？</title>
<desc id="d">都不行。L 与 N 阶段开车时不许使用任何电子设备，手持和免提都算；红灯停着、堵在车流里同样适用。唯一例外是紧急情况拨打 911。</desc>
<rect width="900" height="1420" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="162" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">新手电子设备禁令 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">拿 L 或 N 牌开车，能不能用免提打电话、用手机导航，红</text>
<text x="40" y="132" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">灯停着能看手机吗？</text>
<rect x="40" y="186" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="217" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="253" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">都不行。L 与 N 阶段开车时不许使用任何电子设备，手持和免提都算；红灯停</text>
<text x="64" y="286" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">着、堵在车流里同样适用。唯一例外是紧急情况拨打 911。</text>
<text x="40" y="362" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">ICBC 点名的「使用」</text>
<rect x="40.0" y="382" width="403.0" height="229" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="54.0" y="414" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">手和眼</text>
<text x="54.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">手机本身</text>
<text x="54.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">触碰、操作、拿着或调整手机</text>
<text x="54.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">导航</text>
<text x="54.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">设定 GPS</text>
<text x="54.0" y="554" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">音乐</text>
<text x="54.0" y="576" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">用手机选歌；把手机接到车载音响放音乐</text>
<rect x="457.0" y="382" width="403.0" height="229" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="471.0" y="414" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">耳和嘴</text>
<text x="471.0" y="442" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">免提</text>
<text x="471.0" y="464" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">蓝牙或有线耳机免提通话</text>
<text x="471.0" y="498" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">扩音</text>
<text x="471.0" y="520" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">一键或语音操作的扩音通话</text>
<text x="471.0" y="554" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">耳机</text>
<text x="471.0" y="576" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">戴耳机</text>
<text x="40" y="655" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">什么时候算</text>
<rect x="40" y="673" width="820" height="98" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="707" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">行驶中</text>
<circle cx="64" cy="736" r="3.2" fill="#B42318"/>
<text x="76" y="741" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">上面每一项都禁止</text>
<line x1="450" y1="772" x2="450" y2="799" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,796 L458,796 L450,808 Z" fill="#5B6B7F"/>
<text x="466" y="791" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">停下来也一样</text>
<rect x="40" y="810" width="820" height="98" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="844" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">红灯停着、堵车不动</text>
<circle cx="64" cy="873" r="3.2" fill="#B42318"/>
<text x="76" y="878" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">官方页写明同样适用</text>
<line x1="450" y1="910" x2="450" y2="937" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,934 L458,934 L450,946 Z" fill="#5B6B7F"/>
<text x="466" y="929" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">唯一例外</text>
<rect x="40" y="948" width="820" height="98" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="982" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">紧急情况</text>
<circle cx="64" cy="1011" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1016" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">可以拨打 911</text>
<rect x="40" y="1067" width="820" height="186" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1101" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1130" r="3.2" fill="#B45309"/>
<text x="76" y="1135" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「不手持、只用蓝牙就没事」：一般 Class 5 驾驶者可以用免提，L 与 N 不行。</text>
<circle cx="64" cy="1162" r="3.2" fill="#B45309"/>
<text x="76" y="1167" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「25 岁以上的 N 规则放宽了，手机也放宽了」：放宽的是 N 牌与乘客限制，电子设备禁令照旧。</text>
<circle cx="64" cy="1193" r="3.2" fill="#B45309"/>
<text x="76" y="1198" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「只是一张罚单」：GLP 驾驶者被开一张罚单，驾驶记录就可能被审、可能禁驾；电子设备类定罪也</text>
<text x="76" y="1224" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">会让升级评估不合格。</text>
<line x1="40" y1="1279" x2="860" y2="1279" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1304" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1326" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Get your L / Get your N（Rules for cellphone use，2026-11-03 回读）</text>
<text x="40" y="1348" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · You hold a Class 7 licence and you're 25 or older</text>
<text x="40" y="1377" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC 现行规则，适用于 L（Class 7L）与 N（Class 7）驾驶者；罚款与记分以 ICBC 现行罚则为准。</text>
</svg>
